[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liveavatar-nari"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0,<2.9",
    "numpy",
    "Pillow",
    "torchvision",
    "tqdm",
    "safetensors",
    "diffusers>=0.37",
    "transformers",
    "huggingface_hub",
    "imageio[ffmpeg]",
    "pyyaml",
    "librosa",
    "einops",
    "ftfy",
    "regex",
]

[project.optional-dependencies]
lora = ["peft>=0.10"]
flash = ["flash-attn-3"]

[project.scripts]
liveavatar-infer = "liveavatar_nari.cli.inference:main"

[tool.uv]
find-links = [
    "https://windreamer.github.io/flash-attention3-wheels/cu128_torch280",
]
extra-index-url = [
    "https://download.pytorch.org/whl/cu128",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
include = ["liveavatar_nari*"]
